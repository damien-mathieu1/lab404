apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml

helmGlobals:
  chartHome: .cache/charts

helmCharts:
  - name: metallb
    repo: https://metallb.github.io/metallb
    version: 0.16.1
    releaseName: metallb
    namespace: metallb-system
    includeCRDs: true
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.8.3
    releaseName: envoy-gateway
    namespace: envoy-gateway-system
    includeCRDs: true
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.165.0
    releaseName: otel-collector
    namespace: observability
    valuesFile: opentelemetry-values.yaml
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: 3.9.1
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    # Helm test hooks use readiness-checker:latest and are not platform workloads.
    skipTests: true
    # Kustomize renders Helm hooks as plain resources: the pre-delete hooks would
    # scale Kyverno to zero and remove its webhooks on every apply.
    valuesInline:
      webhooksCleanup:
        enabled: false
      crds:
        migration:
          enabled: false
  - name: sealed-secrets
    repo: https://bitnami.github.io/sealed-secrets
    version: 2.20.0
    releaseName: sealed-secrets
    namespace: kube-system
    includeCRDs: true
    valuesInline:
      # The name and namespace kubeseal looks for by default.
      fullnameOverride: sealed-secrets-controller
